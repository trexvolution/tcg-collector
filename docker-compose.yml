version: '3.8'

services:
  backend-api:
    build: ./backend
    container_name: tcg-backend
    ports:
      - "5000:5000"
    environment:
      - NAMA_PRAKTIKAN=${NAMA_PRAKTIKAN:-Misterius}
      - NIM_PRAKTIKAN=${NIM_PRAKTIKAN:-00000000}

  frontend-web:
    build: ./frontend
    container_name: tcg-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend-api