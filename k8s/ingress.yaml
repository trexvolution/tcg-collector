apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tcg-ingress
  annotations:
    # Anotasi lama tetap boleh ada untuk kompatibilitas
    kubernetes.io/ingress.class: nginx
spec:
  # BARIS WAJIB: Agar ADDRESS terisi dan IP muncul
  ingressClassName: nginx 
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 5000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80